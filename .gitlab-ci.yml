image: python:3.12-slim

stages:
  - pages

pages:
  stage: pages

  before_script:
    - pip install --upgrade pip
    - pip install -r requirements.txt

  script:
    - python -m research_atlas.build
    - mkdocs build
    - rm -rf public
    - cp -r site public

  artifacts:
    paths:
      - public

  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
