<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Research Atlas Editor</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #07111f;
      --panel: #0e1a2c;
      --panel-2: #111f34;
      --border: rgba(148, 163, 184, 0.2);
      --text: #e5edf8;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --accent-2: #2563eb;
      --danger: #fb7185;
      --ok: #22c55e;
      --warn: #f59e0b;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: radial-gradient(circle at top left, rgba(56, 189, 248, 0.13), transparent 32rem), var(--bg);
      color: var(--text);
    }
    a { color: inherit; text-decoration: none; }
    .shell { display: grid; grid-template-columns: 260px minmax(0, 1fr); min-height: 100vh; }
    .nav {
      border-right: 1px solid var(--border);
      background: rgba(7, 17, 31, 0.85);
      padding: 24px;
      position: sticky;
      top: 0;
      height: 100vh;
    }
    .brand { font-weight: 800; font-size: 1.1rem; margin-bottom: 6px; }
    .subtitle { color: var(--muted); font-size: 0.88rem; margin-bottom: 28px; line-height: 1.45; }
    .nav a, .nav button {
      display: block;
      width: 100%;
      padding: 10px 12px;
      border-radius: 12px;
      color: var(--muted);
      background: transparent;
      border: 0;
      text-align: left;
      cursor: pointer;
      font: inherit;
    }
    .nav a:hover, .nav button:hover { background: rgba(56, 189, 248, 0.1); color: var(--text); }
    main { padding: 28px; }
    .topline { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; margin-bottom: 24px; }
    h1 { margin: 0 0 8px; font-size: clamp(2rem, 4vw, 3.3rem); line-height: 1; }
    h2 { margin: 0 0 14px; font-size: 1.1rem; }
    h3 { margin: 0 0 8px; }
    p { line-height: 1.55; }
    .muted { color: var(--muted); }
    .grid { display: grid; grid-template-columns: repeat(12, 1fr); gap: 18px; }
    .card {
      background: linear-gradient(180deg, rgba(17, 31, 52, 0.96), rgba(14, 26, 44, 0.96));
      border: 1px solid var(--border);
      border-radius: 22px;
      padding: 18px;
    }
    .span-4 { grid-column: span 4; }
    .span-5 { grid-column: span 5; }
    .span-7 { grid-column: span 7; }
    .span-8 { grid-column: span 8; }
    .span-12 { grid-column: span 12; }
    .metric { font-size: 2rem; font-weight: 800; }
    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      border: 1px solid rgba(56, 189, 248, 0.35);
      background: rgba(56, 189, 248, 0.12);
      color: var(--text);
      border-radius: 999px;
      padding: 9px 14px;
      cursor: pointer;
      font: inherit;
    }
    .button.primary { background: linear-gradient(135deg, var(--accent-2), var(--accent)); color: white; border-color: transparent; }
    input, textarea, select {
      width: 100%;
      border: 1px solid var(--border);
      background: rgba(7, 17, 31, 0.75);
      color: var(--text);
      border-radius: 12px;
      padding: 10px 12px;
      font: inherit;
    }
    textarea { min-height: 120px; resize: vertical; }
    label { display: block; color: var(--muted); font-size: 0.85rem; margin: 12px 0 6px; }
    .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
    .project-list { display: grid; gap: 12px; }
    .project-item {
      display: block;
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 14px;
      background: rgba(7, 17, 31, 0.4);
    }
    .project-item:hover { border-color: rgba(56, 189, 248, 0.5); }
    .badge {
      display: inline-flex;
      border-radius: 999px;
      padding: 4px 9px;
      background: rgba(56, 189, 248, 0.12);
      color: #bae6fd;
      font-size: 0.75rem;
    }
    .status-done { color: var(--ok); }
    .status-blocked { color: var(--danger); }
    .status-in_progress { color: var(--warn); }
    table { width: 100%; border-collapse: collapse; }
    th, td { border-bottom: 1px solid var(--border); padding: 10px; text-align: left; vertical-align: top; }
    th { color: var(--muted); font-weight: 600; }
    .image-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 14px; }
    .image-grid img { width: 100%; border-radius: 14px; border: 1px solid var(--border); }
    .progress { height: 9px; background: rgba(148, 163, 184, 0.18); border-radius: 999px; overflow: hidden; }
    .progress > span { display: block; height: 100%; background: linear-gradient(90deg, var(--accent-2), var(--accent)); }
    .hidden {
  display: none !important;
}

.update-card-header {
  display: flex;
  justify-content: space-between;
  gap: 18px;
  align-items: flex-start;
  margin-bottom: 16px;
}

.update-card-header h3 {
  margin-top: 0;
  margin-bottom: 4px;
}

.update-text pre {
  white-space: pre-wrap;
  font-family: inherit;
  line-height: 1.55;
  margin: 0 0 18px;
  color: inherit;
  background: transparent;
  border: none;
  padding: 0;
}

.update-edit-form {
  margin-top: 16px;
}

.edit-actions {
  display: flex;
  gap: 12px;
  margin-top: 18px;
}

.ra-update-textarea {
  width: 100%;
  min-height: 360px;
  resize: vertical;
  font-family: inherit;
  line-height: 1.5;
}

.editor-update-images {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(260px, 420px));
  gap: 16px;
  margin: 18px 0 22px;
}

.editor-update-figure {
  margin: 0;
  padding: 12px;
  border: 1px solid var(--border);
  border-radius: 14px;
  background: rgba(2, 6, 23, 0.35);
}

.editor-update-figure img {
  width: 100%;
  max-height: 360px;
  object-fit: contain;
  border-radius: 10px;
  display: block;
}

.editor-update-figure figcaption {
  margin-top: 10px;
  color: var(--muted);
  font-size: 0.85rem;
}
.plain-section {
  padding: 0;
  margin-top: 32px;
  border: none;
  background: transparent;
  box-shadow: none;
}

.update-card {
  padding: 18px 20px;
  margin-bottom: 28px;
  border: 1px solid var(--border);
  border-radius: 16px;
  background: rgba(15, 23, 42, 0.45);
}     
.checkbox-label {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-top: 14px;
  color: var(--muted);
}

.checkbox-label input {
  width: auto;
}
    @media (max-width: 900px) {
      .shell { grid-template-columns: 1fr; }
      .nav { position: static; height: auto; }
      .span-4, .span-5, .span-7, .span-8, .span-12 { grid-column: span 12; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <aside class="nav">
      <div class="brand">Research Atlas</div>
      <div class="subtitle">Local editor for a Git-backed research showcase.</div>
      <a href="/">Dashboard</a>
      <form method="post" action="/build" style="margin-top: 8px;">
        <button type="submit">Generate static site</button>
      </form>
      <p class="subtitle" style="margin-top: 28px;">After editing, run <code>git add .</code>, commit, and push to publish with GitLab Pages.</p>
    </aside>
    <main>
      {% block content %}{% endblock %}
    </main>
  </div>
</body>
</html>
