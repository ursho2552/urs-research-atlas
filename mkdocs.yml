site_name: Research Atlas
site_description: A local-first, Git-backed project showcase for researchers.
site_author: Research Atlas

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.indexes
    - content.code.copy
    - search.suggest
    - search.highlight
  palette:
    scheme: slate
    primary: blue
    accent: cyan

extra_css:
  - assets/stylesheets/research-atlas.css

extra_javascript:
  - assets/javascripts/research-atlas.js

nav:
  - Home: index.md
  - Projects:
      - Overview: projects/index.md
  - Todo: todo.md
  - Gallery: gallery.md
  - About: about.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
