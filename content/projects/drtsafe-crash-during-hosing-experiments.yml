- id: 20260908173708-drtsafe-crash-during-high-latitude-hosing-experiments
  date: 2026-09-08 17:37
  title: DRTsafe crash during high-latitude hosing experiments
  text: "Uniform freshwater hosing experiments (>50°N) in GFDL-ESM2M crash reliably\
    \ around year-day 10-25 with *drtsafe: root not bracketed* in TOPAZ's carbonate\
    \ chemistry (*FMS_ocmip2_co2calc.F90*), triggered by temperature/salinity reaching\
    \ unphysical values. Root cause has been identified with high confidence; it is\
    \ a structural property of the model's B-grid discretization, not a fixable code\
    \ defect, so we are not pursuing a deterministic fix. Current mitigation is restarting\
    \ from Jan 1 with a small (~10⁻¹² K) perturbation to the lowest atmospheric level\
    \ until a run completes.\r\n\r\n**Root cause:**\r\n\r\n- The drtsafe failure is\
    \ a downstream symptom: unphysical T/S reach TOPAZ once a genuine ocean dynamical\
    \ instability has already run away.\r\n- The actual instability is a B-grid \"\
    gravity wave null mode\" (checkerboard noise) in the barotropic/free-surface solver\
    \ — a documented pathology of this grid family (confirmed both in the code's own\
    \ comments and independently: MOM6 moved to C-grid specifically to avoid it).\r\
    \n- It is consistently anchored at grid point (75,198) / ~86.4°N, 104.5°E — one\
    \ row from the tripolar grid's FOLD_NORTH_EDGE seam, a numerically delicate part\
    \ of the domain, where grid cells are also ~25% smaller than mid-latitude and\
    \ a moderate local bathymetric gradient exists.\r\n- The hosing forcing itself\
    \ was verified clean: uniform at the source, and correctly/gently distributed\
    \ over its 40 m insertion depth (magnitude ~2.6 ppm of a grid cell's mass per\
    \ timestep) — not an independent contributor.\r\n- Confirmed the instability is\
    \ marginal/chaotic, not deterministic: a round-off-level (10⁻¹² K) perturbation\
    \ to the atmosphere restart state changes whether a given run crashes at all,\
    \ which might be evidence that the system sits on a bifurcation, not near one\
    \ with exploitable margin.\r\n\r\n**What was tried and ruled out as a full fix:**\r\
    \n\r\n- CFL clamp in the tracer advection scheme (advect_tracer_mdppm) \r\n- Global\
    \ barotropic damping, both Laplacian and biharmonic families\r\n- Finer barotropic\
    \ sub-stepping (barotropic_split 80→120→250) \r\n- Spatially localized damping\
    \ patch at the fold "
