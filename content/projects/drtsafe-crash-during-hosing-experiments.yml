id: drtsafe-crash-during-hosing-experiments
title: DRTSafe crash during hosing experiments
summary: "When using hosing experiment following the NaHOSMIP protocol, the simulations\
  \ with GFDL-ESM2M crash. The crash occurs at the same position in the Arctic at\
  \ (i,j) = (75, 198). \r\n\r\nWe noticed that there appear to be some instabilities\
  \ in salinity and temperature at depth. From one depth level to the next, the temperature\
  \ can oscillate between +10°C and -10°C. These oscillations usually start roughly\
  \ two days before the crash.\r\n\r\nWe traced the error to the piecewise parabolic\
  \ method advection scheme (function advect_tracer_mdppm in the ocean_tracer_advect.F90\
  \ module). This function tries to keep the tendency in temperature and salinity\
  \ within some boundaries. However, if these boundaries become very narrow, small\
  \ overshoots may occur and accumulate over time, which ultimately leads to the large\
  \ instabilities.\r\n\r\nTo avoid this crash, the usual solution is to restart the\
  \ failed simulation year with a small perturbation.\r\n\r\nThe goal of this project\
  \ is to inspect why this crash occurs, find possible solutions, implement them,\
  \ and test them for future hosing simulations."
