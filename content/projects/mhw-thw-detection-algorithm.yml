id: mhw-thw-detection-algorithm
title: MHW-THW detection algorithm
summary: "From the MHW-THW workshop, we decided to define compound extremes as those\
  \ that have atmospheric wet bulb extremes that extend over land and ocean, and that\
  \ overlap at least partially with marine heatwaves based on sea surface temperature.\
  \ To this end, we try to develop an algorithm to efficiently detect them and summarize\
  \ them.\r\n\r\nThis part of the project will be done by Emma Ferri (ETH Zürich)"
