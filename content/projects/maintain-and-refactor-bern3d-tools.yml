id: maintain-and-refactor-bern3d-tools
title: Maintain and refactor Bern3D Tools
summary: Develop and maintain tools for repetitive Bern3D workflows such as spin-up
  runs, sensitivity analysis, Latin hypercube sampling, and model-output analysis.
  The tools should be refactored to become more user-friendly, customizable, and reproducible,
  with the long-term goal of delivering them as a shareable Python package.
