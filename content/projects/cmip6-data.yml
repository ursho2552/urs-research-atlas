title: CMIP6 data
summary: "For the analysis of marine heatwaves we would like to use CMIP6 model data\
  \ for a multi-model comparison. To this end, we would like to download CMIP6 simulations\
  \ across all models. Specifically, we need to download daily sea surface temperature,\
  \ and monthly subsurface temperature across all models and scenarios.\r\n\r\nTo\
  \ this end, we develop a re-usable tool to automatically search and download variables\
  \ from models, and scenarios specified by the user"
