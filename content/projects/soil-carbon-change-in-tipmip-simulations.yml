updates:
- id: 20260915144035-understanding
  date: 2026-09-15 14:40
  title: Understanding
  text: "In GFDL-ESM2M, the land model LM3 from Shevliakova et al. 2009 is used.\r\
    \n\r\nIn this model, there are two carbon pools in the soil, a fast and slow carbon\
    \ pool. Both of them have a flux to the atmosphere, that is dependent on the average\
    \ soil temperature and the soil moisture.\r\n\r\n"
  images:
  - path: assets/uploads/soil-carbon-change-in-tipmip-simulations/updates/2026-09-15-1440-lm3-factors.png
    caption: Soil carbon sink multiplier as a function of the soil temperature and
      soil moisture
    uploaded: 2026-09-15 14:40
- id: 20260915144438-possible-explanation
  date: 2026-09-15 14:44
  title: Possible explanation
  text: "Todd-Brown et al., 2014 performed a multi-model analysis of CMIP5 models,\
    \ which included the GFDL-ESM2MG, finding a similarly high soil carbon loss at\
    \ high latitudes. \r\n\r\nThis was attributed to the lack of permafrost dynamics\
    \ in CMIP5 models."
- id: 20260922074751-increase-in-soil-temperature-as-main-driver
  date: 2026-09-22 07:47
  title: Increase in soil temperature as main driver
  text: The sustained high temperature of roughly +8°C above piControl during the
    4°C stabilisation branch is the most likely driver for the increased soil carbon
    loss in the high latitudes
