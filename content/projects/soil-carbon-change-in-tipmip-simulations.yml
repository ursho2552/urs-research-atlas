id: soil-carbon-change-in-tipmip-simulations
title: Soil carbon change in TIPMIP simulations
summary: "A multi-model analysis showed that the soil carbon response in GFDL-ESM2M\
  \ deviates a lot from all other models, with a very large carbon loss at higher\
  \ latitudes. \r\n\r\nFor the comparison, the processes responsible for this large\
  \ increase in soil carbon need to be understood."
