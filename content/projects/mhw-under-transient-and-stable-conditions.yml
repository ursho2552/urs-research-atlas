id: mhw-under-transient-and-stable-conditions
title: MHW under transient and stable conditions
summary: For a chapter on marine heatwaves, we will analyse how marine heatwave characteristics
  differ under transient temperature conditions compared to long term stable temperature
  conditions. To this end, we will use AERA simulations with different temperature
  targets.
