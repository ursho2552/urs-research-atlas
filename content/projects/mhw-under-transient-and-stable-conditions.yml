updates:
- id: 20261016135547-building-timeseries
  date: 2026-10-16 13:55
  title: Building timeseries
  text: The global atmospheric time series and global ocean temperature are being
    calculated. The temporal evolution of these will be used to determine the year
    in which the warming level with respect to pre-industrial conditions is reached
    for each ensemble member, and the year in which the temperature in the ocean reaches
    equilibrium.
- id: 20261019120450-established-when-simulations-reach-global-warming-level
  date: 2026-10-19 12:04
  title: Established when simulations reach global warming level
  text: Determined the first year when a 31-year running mean of the 2 m air temperature
    reaches the global warming level of 1.5, 2.0, and 3.0°C
  images:
