updates:
- id: 20260803112144-update-to-new-version
  date: 2026-08-03 11:21
  title: Update to new version
  text: "The update of SpeedyWeather to the newest version was not straight forward.\
    \ \r\n\r\nA simple `Pkg.update` would not work due to dependencies being preserved.\
    \ Instead we used `Pkg.update(\"SpeedyWeather\"; preserve=Pkg.PRESERVE_NONE)`"
- id: 20260804163218-bug-in-speedy-river-runoff
  date: 2026-08-04 16:32
  title: Bug in Speedy river runoff
  text: "When implementing runoff into the freshwater flux, I encountered a bug in\
    \ the current SpeedyWeather release v0.21.1.\r\n\r\nIn `soil_moisture.jl`, the\
    \ river runoff accumulation in the `land_bucket_soil_moisture_kernel` appears\
    \ wrong. The implementation currently uses:\r\n```\r\nR[ij] += Δt * (1 - p) *\
    \ δW₁ * f₁,\r\n```\r\nwhich based on the units used in the kernel, results in\
    \ R having the units `m s` rather than `s`, i.e., the magnitude of the runoff\
    \ scales with the timestep rather than the precipitation. This also explains why\
    \ the river runoff is so much higher than `rain_large_scale`, `rain_convection`,\
    \ and `snow_large_scale`.\r\n\r\nTo test this, I created a branch, where the runoff\
    \ is now calculated using:\r\n```\r\nR[ij] += (1 - p) * δW₁ * f₁ \r\n```\r\nwhich\
    \ results in runoff values that are at least comparable to the other freshwater\
    \ accumulators\r\n\r\n"
