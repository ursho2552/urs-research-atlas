id: re-run-hosing-simulations-for-amoc-collapse-paper
title: Re-run hosing simulations for AMOC collapse paper
summary: "In GFDL-ESM2M, the standard ideal hosing routine adds tracers such as DIC\
  \ and alkalinity together with the freshwater flux. While freshwater input in reality\
  \ should have a certain amount of alkalinity and DIC, this may not be ideal for\
  \ idealised hosing experiments, as the input of DIC and alkalinity may influence\
  \ the global carbon cycle.\r\n\r\n\r\nAs such, we adapted the standard hosing routine\
  \ in a separate branch (*vertical_hosing*), which adds freshwater without any tracers.\
  \ The only \"tracers\" that may still enter the ocean are temperature and salinity.\
  \ For the publication “Climate and Carbon Cycle Responses to a 21st Century AMOC\
  \ Collapse under a 2 °C Stabilization Pathway” (Frölicher et al., 2026), we need\
  \ to re-run the simulations with the new *vertical_hosing* branch.\r\n\r\n\r\nBibliography\r\
  \n\r\n- Frölicher, T. L., Maier, P., Burger, F. A., Silvy, Y., Swingedouw, D., &\
  \ Elizondo, U. H. (2026). Climate and Carbon Cycle Responses to a 21st century AMOC\
  \ collapse under a 2°C stabilization pathway. https://doi.org/10.5194/egusphere-egu26-22272"
