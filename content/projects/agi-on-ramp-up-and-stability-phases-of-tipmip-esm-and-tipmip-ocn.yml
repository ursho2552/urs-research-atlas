- id: 20260730151706-adjust-bias-correction
  date: 2026-07-30 15:17
  title: Adjust bias correction
  text: Since we are using the existing pipeline for tipmip experiments rather than
    historical runs, we do not need to use the WOA-bias correction, which was producing
    empty fields for the hosing simulations. The empty fields were caused because
    the simulation periods did not match the WOA period.
  updated: 2026-07-30 15:56
