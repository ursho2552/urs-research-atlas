id: agi-on-ramp-up-and-stability-phases-of-tipmip-esm-and-tipmip-ocn
title: AGI on ramp-up and stability phases of TIPMIP-ESM and TIPMIP-OCN
summary: Run our AGI pipeline on the ramp-up and stability phases of the TIPMIP-ESM,
  TIPMIP-OCN, and TIPMIP-SOCN simulations. For the TIPMIP-(S)OCN simulations use the
  tier 1 simulations (i.e., 0.3 Sv). In addition, also run the same pipeline but for
  NASA-GISS output.
