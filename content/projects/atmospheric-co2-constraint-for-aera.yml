updates:
- id: 20260728161112-reproducibility-bug
  date: 2026-07-28 16:11
  title: Reproducibility bug
  text: The reproducibility bug was caused by the combination of the meta_data.nc
    files. In the single target version, the  older slope parameters are stored as
    vectors. During the combination of the temperature and aragonite meta_data file,
    this structure is broken, and previous parameters are stored as scalars. This
    then leads to the  silent bug, where AERA does not recognise the parameters and
    assumes it is the first stocktake year
- id: 20260729103727-update-in-aera-code-worked
  date: 2026-07-29 10:37
  title: Update in AERA code worked
  text: Marine tested the new setup on CSCS for 10 years. The simulations are now
    identical when using the combined version against the single version.
