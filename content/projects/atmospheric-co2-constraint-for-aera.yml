updates:
- id: 20260728161112-reproducibility-bug
  date: 2026-07-28 16:11
  title: Reproducibility bug
  text: The reproducibility bug was caused by the combination of the meta_data.nc
    files. In the single target version, the  older slope parameters are stored as
    vectors. During the combination of the temperature and aragonite meta_data file,
    this structure is broken, and previous parameters are stored as scalars. This
    then leads to the  silent bug, where AERA does not recognise the parameters and
    assumes it is the first stocktake year
- id: 20260729103727-update-in-aera-code-worked
  date: 2026-07-29 10:37
  title: Update in AERA code worked
  text: Marine tested the new setup on CSCS for 10 years. The simulations are now
    identical when using the combined version against the single version.
- id: 20260810161237-running-offline-tests
  date: 2026-08-10 16:12
  title: Running offline tests
  text: "I have now implemented the use of atmospheric C content for estimating future\
    \ emissions until a certain $\\Omega$ target is reached. This is currently done\
    \ without any real feedback from the model. This is done as follows:\r\n\r\n1.\
    \ Run AERA on 2026 creating an emissions file,\r\n2. Copy simulation files from\
    \ an existing run\r\n3. After each run, save the Omega values\r\n4. On the next\
    \ stocktake, run AERA again\r\n\r\nThis is done to check whether the pipeline\
    \ would run, and to see the emissions and file structure created. The model response\
    \ will be wrong, as the emissions used in the actual model run stem from the old\
    \ AERA implementation that used cumulative emissions instead of the atmospheric\
    \ C content.\r\n"
- id: 20260811161639-testing-the-new-implementation
  date: 2026-08-11 16:16
  title: Testing the new implementation
  text: "The new implementation is now being tested on CSCS. \r\n\r\nAfter fixing\
    \ some problems in the setup and run-scripts, the model appears to run smoothly,\
    \ with updated emission fields derived from the atmospheric carbon content and\
    \ the land/ocean sink."
- id: 20260812161820-proof-of-concept
  date: 2026-08-12 16:18
  title: Proof of concept
  text: "After the implementation, the first test run successfully and allowed us\
    \ to discover different bugs in the original implementation., which have now been\
    \ addressed.\r\n\r\nFurthermore, we found a strange pattern in the estimated emissions,\
    \ that overshoot every second stocktake year, leading to a zig-zag pattern shown\
    \ in the attached plot."
