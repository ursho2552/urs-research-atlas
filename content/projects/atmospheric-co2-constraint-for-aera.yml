id: atmospheric-co2-constraint-for-aera
title: Atmospheric CO2 constraint for AERA
summary: "This project aims at extending AERA by introducing a second target based\
  \ on the global surface ocean aragonite saturation state, in addition to the existing\
  \ global mean surface temperature target.\r\n\r\nFor this new target, we use atmospheric\
  \ CO$_2$ content rather than cumulative emissions to determine allowable future\
  \ emissions. This is necessary because, once the target is reached, the ocean and\
  \ land continue to absorb atmospheric CO$_2$ . As atmospheric CO$_2$  declines,\
  \ some additional emissions may therefore become compatible with maintaining the\
  \ prescribed aragonite saturation state.\r\n\r\nTo account for this, we implemented\
  \ a new constraint based on atmospheric carbon content. The framework determines\
  \ the atmospheric CO$_2$  level associated with the target aragonite saturation\
  \ state and uses its subsequent evolution to derive allowable future emissions.\
  \ This allows emissions to respond dynamically to continued land and ocean carbon\
  \ uptake after the target has been reached."
